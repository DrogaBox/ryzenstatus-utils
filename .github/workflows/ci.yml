name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Only a newer run of the same pull request cancels an older one. Each push to
# main gets a group of its own (its commit), so no main run is cancelled, or
# replaced while it waits in the queue: that tree is the one a release reuses.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR that only touches docs, GPU/ or kernel sources cannot change the app's
  # SDK 15 build. A push to main has no reliable changed-file base here, so it
  # always runs the SDK job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code || steps.nonpr.outputs.code }}
    steps:
      - name: Check changed paths
        id: paths
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const code = files.some(({filename}) =>
              filename.startsWith('Sources/') ||
              filename.startsWith('Tests/') ||
              filename.startsWith('Resources/') ||
              filename.startsWith('Config/') ||
              filename === 'Package.swift' ||
              filename === 'build.sh' ||
              filename === 'Tools/MakeIcon.swift' ||
              filename === '.github/workflows/ci.yml');
            core.setOutput('code', code ? 'true' : 'false');

      - name: Non-PR builds always run the SDK check
        id: nonpr
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"

  test:
    name: Tests & concurrency gate
    runs-on: macos-26
    # Unit tests and the gate take about half an hour together.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Unit tests
        run: ./build.sh --test

      - name: AMD concurrency gate
        run: ./Tools/concurrency-gate.sh

      # 1.90.0 shipped an installer that called /usr/bin/chown, which is not there on macOS;
      # every install stopped after the password. This reads what the root installers and the
      # installer window name and fails on a path this runner does not have, before any disk
      # image is built.
      - name: Installer command paths
        run: zsh GPU/tests/command_paths.sh

  # Build and packaging are independent of the tests. Running them in parallel
  # keeps the PR's wall clock near the longer half instead of their sum; a
  # failed test job still fails the workflow and release.yml only reuses a run
  # whose status is success.
  package:
    name: Build & package
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Build
        run: ./build.sh

      - name: Install Rosetta
        run: |
          if [[ ! -f /Library/Apple/usr/share/rosetta/rosettaRuntimeVersions ]] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Selftest
        run: ./build/RyzenStatus --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyzenStatus-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # Compile the full app against the macOS 15 SDK with a pre-26 toolchain
  # (Swift < 6.2). Exercises the #if compiler(>=6.2) fallback branches in
  # MixerSection/SettingsView so macOS-26-only APIs (GlassEffectContainer,
  # glassEffect, scrollEdgeEffectStyle) are proven to compile out on Sequoia.
  sdk15:
    name: SDK 15 fallback build (Xcode 16)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 16 (Swift < 6.2, SDK 15)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain
        run: |
          swift --version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Build against SDK 15
        run: ./build.sh
