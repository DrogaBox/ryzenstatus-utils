name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & selftest
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Unit tests
        run: ./build.sh --test

      - name: Build
        run: ./build.sh

      - name: Install Rosetta
        run: |
          if [[ ! -f /Library/Apple/usr/share/rosetta/rosettaRuntimeVersions ]] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Selftest
        run: ./build/RyzenStatus --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyzenStatus-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # Compile the full app against the macOS 15 SDK with a pre-26 toolchain
  # (Swift < 6.2). Exercises the #if compiler(>=6.2) fallback branches in
  # MixerSection/SettingsView so macOS-26-only APIs (GlassEffectContainer,
  # glassEffect, scrollEdgeEffectStyle) are proven to compile out on Sequoia.
  sdk15:
    name: SDK 15 fallback build (Xcode 16)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 16 (Swift < 6.2, SDK 15)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain
        run: |
          swift --version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Build against SDK 15
        run: ./build.sh
