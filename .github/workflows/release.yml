name: Release

# Push a tag (vX.Y.Z) and CI does the whole release: build (ad-hoc signed —
# permanent policy, no Developer ID or notarization), run the selftest, package
# the styled DMG and publish the GitHub release. Releases are NOT cut locally,
# so nothing ever has to enable/disable a workflow. If a run hits a transient
# failure, re-run it with `gh run rerun <run-id>` (or from the Actions tab); no
# need to retag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish DMG
    runs-on: macos-26
    # Usually done in a couple of minutes: CI has already tested, built,
    # selftested and packaged this exact code on the pull request, so the
    # release takes that DMG. Only when no CI run built this tree does it do
    # the whole build here, and the tests and the release build each compile
    # the whole app, so that path keeps the hour.
    timeout-minutes: 60
    steps:
      # The whole history, so a pull request's head commit can be compared
      # with the tagged merge.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi

      # A successful CI run whose commit has the same tree as the tag already
      # ran the tests, the concurrency gate, the release build, the selftest
      # and the DMG on exactly this code: a pull request merged into a main
      # that had not moved, or the push of the merge itself. Its DMG is the
      # release's. The build is ad-hoc signed and stamps no commit, so the
      # tree is all that decides what it contains.
      - name: Reuse the DMG CI built from this code
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TREE="$(git rev-parse 'HEAD^{tree}')"
          RUNS="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --status success --limit 40 \
                    --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"')"
          while read -r id sha; do
            [[ -n "$id" ]] || continue
            [[ "$(git rev-parse -q --verify "$sha^{tree}" 2>/dev/null)" == "$TREE" ]] || continue
            rm -rf dist && mkdir -p dist
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n RyzenStatus-dmg -D dist \
               && [[ -f "dist/RyzenStatus-$VERSION.dmg" ]]; then
              echo "Reusing the DMG of CI run $id ($sha), built from this same code"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$RUNS"
          rm -rf dist
          echo "No successful CI run built this code; building it here"
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26
        if: steps.reuse.outputs.found != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Unit tests
        if: steps.reuse.outputs.found != 'true'
        run: ./build.sh --test

      - name: Build
        if: steps.reuse.outputs.found != 'true'
        run: ./build.sh

      - name: Install Rosetta
        if: steps.reuse.outputs.found != 'true'
        run: |
          if [[ ! -f /Library/Apple/usr/share/rosetta/rosettaRuntimeVersions ]] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Selftest
        if: steps.reuse.outputs.found != 'true'
        run: ./build/RyzenStatus --selftest

      - name: Package DMG
        if: steps.reuse.outputs.found != 'true'
        run: ./Tools/make-dmg.sh

      - name: Prepare release showcase media
        id: release_files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/showcase

          {
            echo "FILES<<__VRSS_FILES__"
            printf '%s\n' dist/*.dmg
            echo "__VRSS_FILES__"
          } >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $VERSION" >&2
            exit 1
          fi
          # The notes run from this version down to the last published
          # release, so versions that never got a release of their own are
          # not lost. The previous release is the published tag just below
          # this one; with none, or no CHANGELOG entry for it, only this
          # version's entry is used.
          PREV_TAG="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                        --limit 200 --json tagName -q '.[].tagName' \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | { cat; echo "$GITHUB_REF_NAME"; } | sort -uV \
                      | grep -B1 -xF "$GITHUB_REF_NAME" | head -n 1)"
          PREV="${PREV_TAG#v}"
          if [[ -n "$PREV" && "$PREV_TAG" != "$GITHUB_REF_NAME" ]] && grep -Fq "## [$PREV]" CHANGELOG.md; then
            echo "Release notes cover $VERSION back to the last release, $PREV"
            NOTES="$(awk -v hdr="## [$VERSION]" -v stop="## [$PREV]" \
                       'index($0,hdr)==1{g=1;next} g&&index($0,stop)==1{exit} g{print}' CHANGELOG.md)"
          else
            echo "No earlier published release with a CHANGELOG entry; using $VERSION alone"
            NOTES="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{g=1;next} /^## \[/&&g{exit} g{print}' CHANGELOG.md)"
          fi
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md entry for $VERSION is empty" >&2
            exit 1
          fi
          DMG_SHA256="$(cd dist && shasum -a 256 *.dmg)"
          {
            echo "NOTES<<__VRSS_EOF__"
            printf '%s\n' "$NOTES"
            echo ""
            echo "Open the .dmg below and drag RyzenStatus to Applications. This build is ad-hoc signed and not notarized (by design), so bypass Gatekeeper on first launch: right-click → Open, or run: xattr -d com.apple.quarantine /Applications/RyzenStatus.app"
            echo ""
            echo "**SHA-256 Checksum:**"
            echo '```text'
            printf '%s\n' "$DMG_SHA256"
            echo '```'
            echo "__VRSS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.release_files.outputs.FILES }}
          body: ${{ steps.notes.outputs.NOTES }}
          make_latest: true
