name: Release

# Push a tag (vX.Y.Z) and CI does the whole release: build (ad-hoc signed —
# permanent policy, no Developer ID or notarization), run the selftest, package
# the styled DMG and publish the GitHub release. Releases are NOT cut locally,
# so nothing ever has to enable/disable a workflow. If a run hits a transient
# failure, re-run it with `gh run rerun <run-id>` (or from the Actions tab); no
# need to retag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish DMG
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Unit tests
        run: ./build.sh --test

      - name: Verify release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: ./build.sh

      - name: Install Rosetta
        run: |
          if [[ ! -f /Library/Apple/usr/share/rosetta/rosettaRuntimeVersions ]] && ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Selftest
        run: ./build/RyzenStatus --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Prepare release showcase media
        id: release_files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/showcase

          {
            echo "FILES<<__VRSS_FILES__"
            printf '%s\n' dist/*.dmg
            echo "__VRSS_FILES__"
          } >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $VERSION" >&2
            exit 1
          fi
          NOTES="$(awk -v hdr="## [$VERSION]" 'index($0,hdr)==1{g=1;next} /^## \[/&&g{exit} g{print}' CHANGELOG.md)"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "CHANGELOG.md entry for $VERSION is empty" >&2
            exit 1
          fi
          {
            echo "NOTES<<__VRSS_EOF__"
            printf '%s\n' "$NOTES"
            echo ""
            echo "Open the .dmg below and drag RyzenStatus to Applications. This build is ad-hoc signed and not notarized (by design), so bypass Gatekeeper on first launch: right-click → Open, or run: xattr -d com.apple.quarantine /Applications/RyzenStatus.app"
            echo "__VRSS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.release_files.outputs.FILES }}
          body: ${{ steps.notes.outputs.NOTES }}
          make_latest: true
